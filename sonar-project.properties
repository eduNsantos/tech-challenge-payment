sonar.projectKey=tech-challenge-payment-service
sonar.projectName=Tech Challenge - Payment Service
sonar.projectVersion=1.0

# Código das Lambdas (Node.js). Testes unitários (Jest) e BDD (Cucumber) ficam fora das fontes
sonar.sources=src
sonar.tests=src/test,src/features
sonar.exclusions=src/node_modules/**,src/coverage/**,src/test/**,src/features/**,src/cucumber.js
sonar.test.inclusions=src/test/**/*.test.js,src/features/**/*.js
sonar.sourceEncoding=UTF-8

# Cobertura combinada Jest + Cucumber gerada pelo c8: cd src && npm run test:coverage
sonar.javascript.lcov.reportPaths=src/coverage/lcov.info
