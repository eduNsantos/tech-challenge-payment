name: Deploy Payment Service

on:
  push:
    branches:
      - main
  # PR: só o job Test (check obrigatório da regra de proteção da main).
  # Push na main e Run workflow: Test → Deploy.
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PRs ficam num grupo próprio para não cancelar um deploy na fila
  group: ${{ github.event_name == 'pull_request' && format('payment-service-pr-{0}', github.ref) || 'payment-service-deploy' }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1

jobs:

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Mesmo runtime das Lambdas (nodejs24.x); o Cucumber exige Node 22+
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install and test
        run: |
          cd src
          npm ci
          npm test
          npm run test:bdd

  deploy:
    name: Deploy
    needs: test
    # Deploy automático a cada push na main (merge de PR); Run workflow permite redeploy manual.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    env:
      TF_VAR_mp_webhook_secret:    ${{ secrets.MP_WEBHOOK_SECRET }}
      # Não vira variável Terraform: é gravado direto no Secrets Manager após o apply (fica fora do state).
      MP_ACCESS_TOKEN:             ${{ secrets.MP_ACCESS_TOKEN }}
      # Opcional: o application envia notification_url em cada pedido. Só serve de fallback.
      TF_VAR_app_notification_url: ${{ secrets.TF_VAR_app_notification_url }}
      # New Relic — opcional; com qualquer um vazio o deploy sobe sem monitoramento
      TF_VAR_newrelic_license_key: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
      TF_VAR_newrelic_account_id:  ${{ secrets.NEW_RELIC_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Falha antes do apply se o secret do GitHub não existir (evita gravar token vazio)
      - name: Check MP access token
        run: |
          if [ -z "$(printf '%s' "$MP_ACCESS_TOKEN" | tr -d '[:space:]')" ]; then
            echo "::error::Secret MP_ACCESS_TOKEN vazio ou ausente no GitHub."
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Install Lambda dependencies
        run: |
          cd src
          npm ci --omit=dev

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.5"

      - name: Terraform init
        working-directory: infra
        run: |
          for attempt in 1 2 3; do
            echo "Running terraform init (attempt ${attempt}/3)"
            set +e
            terraform init -input=false -reconfigure 2>&1 | tee /tmp/terraform-init.log
            status=${PIPESTATUS[0]}
            set -e

            if [ "$status" -eq 0 ]; then
              break
            fi

            if grep -q "state data in S3 does not have the expected content" /tmp/terraform-init.log && [ "$attempt" -lt 3 ]; then
              echo "Transient S3 checksum mismatch. Waiting 90s before retry..."
              sleep 90
              continue
            fi

            exit "$status"
          done

      - name: Restore and import Secrets Manager secrets
        working-directory: infra
        shell: bash
        run: |
          set -e

          import_secret() {
            local SECRET_NAME="$1"
            local TF_RESOURCE="$2"

            echo "Checking secret: $SECRET_NAME"

            if aws secretsmanager describe-secret \
                --secret-id "$SECRET_NAME" \
                --region "$AWS_REGION" >/dev/null 2>&1; then

              DELETED_DATE=$(aws secretsmanager describe-secret \
                --secret-id "$SECRET_NAME" --region "$AWS_REGION" \
                --query 'DeletedDate' --output text)

              SECRET_ARN=$(aws secretsmanager describe-secret \
                --secret-id "$SECRET_NAME" --region "$AWS_REGION" \
                --query 'ARN' --output text)

              if [ "$DELETED_DATE" != "None" ] && [ "$DELETED_DATE" != "null" ]; then
                echo "Restoring deleted secret: $SECRET_NAME"
                aws secretsmanager restore-secret \
                  --secret-id "$SECRET_NAME" --region "$AWS_REGION" >/dev/null
              fi

              if ! terraform state show "$TF_RESOURCE" >/dev/null 2>&1; then
                echo "Importing $TF_RESOURCE"
                terraform import -input=false "$TF_RESOURCE" "$SECRET_ARN"
              fi
            else
              echo "Secret $SECRET_NAME nao existe, Terraform ira criar."
            fi
          }

          import_secret "payment/mp-access-token"   "aws_secretsmanager_secret.mp_access_token"
          import_secret "payment/mp-webhook-secret" "aws_secretsmanager_secret.mp_webhook_secret"

          # Secret do New Relic só existe no Terraform (count = 1) quando o monitoramento está ligado
          if [ -n "$TF_VAR_newrelic_license_key" ] && [ -n "$TF_VAR_newrelic_account_id" ]; then
            import_secret "payment/newrelic-license-key" "aws_secretsmanager_secret.newrelic_license_key[0]"
          fi

      - name: Terraform plan
        working-directory: infra
        run: terraform plan -input=false

      - name: Terraform apply
        working-directory: infra
        run: terraform apply -input=false -auto-approve

      # O secret payment/mp-access-token é criado pelo Terraform (apply acima); o valor vem do GitHub.
      - name: Publish MP access token
        shell: bash
        run: |
          set -euo pipefail
          aws secretsmanager put-secret-value \
            --secret-id payment/mp-access-token \
            --region "$AWS_REGION" \
            --secret-string "$(jq -cn --arg t "$MP_ACCESS_TOKEN" '{access_token: $t}')" \
            --query VersionId --output text

      # URLs que o application e o Mercado Pago precisam — copie para PAYMENT_SERVICE_URL no app
      - name: Publish integration URLs
        working-directory: infra
        run: |
          set -euo pipefail
          terraform output -json > /tmp/tf-outputs.json
          API_BASE_URL=$(jq -r '.api_base_url.value' /tmp/tf-outputs.json)
          WEBHOOK_URL=$(jq -r '.webhook_url.value' /tmp/tf-outputs.json)
          {
            echo "## URLs de integração"
            echo ""
            echo "| Uso | Valor |"
            echo "|---|---|"
            echo "| \`PAYMENT_SERVICE_URL\` no application | \`${API_BASE_URL}\` |"
            echo "| Webhook no painel do Mercado Pago | \`${WEBHOOK_URL}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
