name: Deploy Payment Service

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      aws_access_key_id:
        description: 'AWS Access Key ID (Academy — expira em ~3h)'
        required: true
        type: string
      aws_secret_access_key:
        description: 'AWS Secret Access Key'
        required: true
        type: string
      aws_session_token:
        description: 'AWS Session Token (Academy obrigatório)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: payment-service-deploy
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1

jobs:

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install and test
        run: |
          cd src
          npm ci
          npm test

  deploy:
    name: Deploy
    needs: test
    # Só roda via workflow_dispatch — credenciais Academy expiram em ~3h
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    env:
      TF_VAR_mp_access_token:      ${{ secrets.TF_VAR_mp_access_token }}
      TF_VAR_mp_webhook_secret:    ${{ secrets.TF_VAR_mp_webhook_secret }}
      TF_VAR_app_notification_url: ${{ secrets.TF_VAR_app_notification_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Mascarar antes de qualquer uso para suprimir das logs
      - name: Mask AWS credentials
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "::add-mask::${{ inputs.aws_access_key_id }}"
          echo "::add-mask::${{ inputs.aws_secret_access_key }}"
          echo "::add-mask::${{ inputs.aws_session_token }}"

      - name: Configure AWS credentials (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ inputs.aws_access_key_id }}
          aws-secret-access-key: ${{ inputs.aws_secret_access_key }}
          aws-session-token:     ${{ inputs.aws_session_token }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Configure AWS credentials (push)
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Install Lambda dependencies
        run: |
          cd src
          npm ci --omit=dev

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.5"

      - name: Ensure Terraform state bucket exists
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BACKEND_BUCKET="techchallenge-tfstate-${ACCOUNT_ID}"
          echo "BACKEND_BUCKET=${BACKEND_BUCKET}" >> "$GITHUB_ENV"

          if aws s3api head-bucket --bucket "$BACKEND_BUCKET" 2>/dev/null; then
            echo "Bucket ${BACKEND_BUCKET} already exists."
          else
            echo "Creating bucket ${BACKEND_BUCKET}..."
            aws s3api create-bucket --bucket "$BACKEND_BUCKET" --region us-east-1
            aws s3api put-bucket-versioning \
              --bucket "$BACKEND_BUCKET" \
              --versioning-configuration Status=Enabled
            aws s3api put-bucket-encryption \
              --bucket "$BACKEND_BUCKET" \
              --server-side-encryption-configuration \
              '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
            aws s3api put-public-access-block \
              --bucket "$BACKEND_BUCKET" \
              --public-access-block-configuration \
              "BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true"
            echo "Bucket ${BACKEND_BUCKET} created."
          fi

      - name: Terraform init
        working-directory: infra
        run: |
          echo "Backend bucket: ${BACKEND_BUCKET}"

          for attempt in 1 2 3; do
            echo "Running terraform init (attempt ${attempt}/3)"
            set +e
            terraform init -backend-config="bucket=${BACKEND_BUCKET}" 2>&1 | tee /tmp/terraform-init.log
            status=${PIPESTATUS[0]}
            set -e

            if [ "$status" -eq 0 ]; then
              break
            fi

            if grep -q "state data in S3 does not have the expected content" /tmp/terraform-init.log && [ "$attempt" -lt 3 ]; then
              echo "Transient S3 checksum mismatch. Waiting 90s before retry..."
              sleep 90
              continue
            fi

            exit "$status"
          done

      - name: Restore and import Secrets Manager secrets
        working-directory: infra
        shell: bash
        run: |
          set -e

          import_secret() {
            local SECRET_NAME="$1"
            local TF_RESOURCE="$2"

            echo "Checking secret: $SECRET_NAME"

            if aws secretsmanager describe-secret \
                --secret-id "$SECRET_NAME" \
                --region "$AWS_REGION" >/dev/null 2>&1; then

              DELETED_DATE=$(aws secretsmanager describe-secret \
                --secret-id "$SECRET_NAME" --region "$AWS_REGION" \
                --query 'DeletedDate' --output text)

              SECRET_ARN=$(aws secretsmanager describe-secret \
                --secret-id "$SECRET_NAME" --region "$AWS_REGION" \
                --query 'ARN' --output text)

              if [ "$DELETED_DATE" != "None" ] && [ "$DELETED_DATE" != "null" ]; then
                echo "Restoring deleted secret: $SECRET_NAME"
                aws secretsmanager restore-secret \
                  --secret-id "$SECRET_NAME" --region "$AWS_REGION" >/dev/null
              fi

              if ! terraform state show "$TF_RESOURCE" >/dev/null 2>&1; then
                echo "Importing $TF_RESOURCE"
                terraform import "$TF_RESOURCE" "$SECRET_ARN"
              fi
            else
              echo "Secret $SECRET_NAME nao existe, Terraform ira criar."
            fi
          }

          import_secret "payment/mp-access-token"   "aws_secretsmanager_secret.mp_access_token"
          import_secret "payment/mp-webhook-secret" "aws_secretsmanager_secret.mp_webhook_secret"

      - name: Terraform plan
        working-directory: infra
        run: terraform plan

      - name: Terraform apply
        working-directory: infra
        run: terraform apply -auto-approve
